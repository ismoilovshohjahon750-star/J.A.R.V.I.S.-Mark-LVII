services:
  - type: web
    name: jarvis-mark-lvii
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REMOTE_SERVER_URL
        sync: false
      - key: REMOTE_SERVER_USER
        sync: false
      - key: REMOTE_SERVER_PASS
        sync: false
